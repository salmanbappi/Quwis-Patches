name: Build and Release MPP

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Prepare Release Artifacts
        run: |
          cd patches/build/libs
          for f in *.mpp; do
            if [ -f "$f" ] && [ "$f" != "patches-1.9.23.mpp" ]; then
              cp "$f" patches-1.9.23.mpp
            fi
          done
          ls -la

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.23
          files: patches/build/libs/*.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-1.9.23
          path: patches/build/libs/*.mpp
